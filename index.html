<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-shell">
        <div class="form-card">
            <div class="header">
                <h1>Student Registration</h1>
                <p>Register a new student in the system</p>
            </div>

            <div id="statusMessage" class="status-message" role="status" aria-live="polite" hidden></div>

            <form id="studentForm" novalidate>
                <div class="form-grid">
                    <div class="field-group">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" name="first_name" placeholder="Enter first name" required>
                    </div>

                    <div class="field-group">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" name="last_name" placeholder="Enter last name" required>
                    </div>

                    <div class="field-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="student@example.com" required>
                    </div>

                    <div class="field-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="+1234567890" required>
                    </div>

                    <div class="field-group">
                        <label for="course">Course</label>
                        <input type="text" id="course" name="course" placeholder="Computer Science" required>
                    </div>

                    <div class="field-group">
                        <label for="student_id">Student ID</label>
                        <input type="text" id="student_id" name="student_id" placeholder="STU-2026-001" required>
                    </div>

                    <div class="field-group">
                        <label for="date_of_birth">Date of Birth</label>
                        <input type="date" id="date_of_birth" name="date_of_birth" required>
                    </div>

                    <div class="field-group">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="field-group full-width">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" rows="4" placeholder="Enter full address" required></textarea>
                </div>

                <button type="submit" class="submit-btn">Register Student</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
